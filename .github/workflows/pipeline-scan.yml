name: Pipeline Security Scan

on:
  workflow_call:
    outputs:
      scan-result:
        description: "Pipeline scan result"
        value: ${{ jobs.pipeline-scan.outputs.result }}

jobs:
  # 🚧 REPLACE THIS ENTIRE 'jobs:' SECTION WITH WORKSHOP CONTENT! 🚧
  # Copy from: workshop/pipeline_scan/{tool}/workflow.yml

  repository-scan:
    name: Repository Scan with Prowler
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan-result.outputs.result }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Prowler
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
            # Prowler supports Python >=3.10,<3.14. Pin the interpreter and require v5+ so pip
            # can't silently fall back to an ancient release on a newer runner Python.
            pipx install --python "$PYTHON_BIN" 'prowler>=5'

      - name: Check prowler version
        run: |
            prowler -v

      - name: Run Prowler
        id: prowler
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        # We will run just a few subset of checks for time purposes
        run: |
            prowler github --repository ${{ github.repository }} \
              --checks repository_public_has_securitymd_file repository_default_branch_protection_enabled repository_default_branch_status_checks_required \
              --output-formats html

      - name: Upload Prowler HTML Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prowler-html-report
          path: output/*.html
          retention-days: 1

      - name: Summarize findings
        if: always()
        run: |
          if [ "${{ steps.prowler.outcome }}" == "success" ]; then
            echo "✅ No security alerts"
          else
            echo "❌ Prowler detected repository security issues."
            echo "🔍 View findings: download the 'prowler-html-report' artifact from this run (Artifacts section at the top of the run page)."
          fi

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          if [ "${{ steps.prowler.outcome }}" == "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Pipeline scan passed"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Pipeline scan failed"
          fi